name: Typst PDF Diff Action
description: 'Generate PDF diffs for Typst documents'
author: conjikidow

branding:
  icon: file-text
  color: green

inputs:
  target-files:
    description: 'Space-separated Typst entrypoint files to compile.'
    required: true
  typst-version:
    description: 'Version of Typst to use.'
    required: false
    default: 'latest'
  submodules:
    description: 'Submodule mode passed to `actions/checkout`: `false`, `true`, or `recursive`.'
    required: false
    default: false
  head-ref:
    description: 'Head revision to compare. Defaults to the PR head SHA or `github.sha`.'
    required: false
    default: ''
  base-ref:
    description: 'Base revision to compare. Defaults to the merge-base of the PR or `github.event.before`.'
    required: false
    default: ''
  post-comment:
    description: 'Whether to post a PR comment with the diff results.'
    required: false
    default: true
  comment-mode:
    description: 'Handling of earlier comments: `replace` deletes them, `append` keeps them.'
    required: false
    default: replace
  fail-on-comment-error:
    description: 'Whether to fail the action when posting or deleting comments fails.'
    required: false
    default: false
  upload-artifacts:
    description: 'Whether to upload the head and diff PDFs as workflow artifacts.'
    required: false
    default: true
  github-token:
    description: >-
      Token used to authenticate with GitHub.
      Needs `contents: read` for the checkout and `pull-requests: write` for the comment.
    required: false
    default: ${{ github.token }}
  head-dir:
    description: 'Existing working tree to build the head revision from. Requires `base-dir`.'
    required: false
    default: ''
  base-dir:
    description: 'Existing working tree to build the base revision from. Requires `head-dir`.'
    required: false
    default: ''

outputs:
  has-diff:
    description: '`true` when at least one target file produces a diff PDF.'
    value: ${{ steps.generate-diff.outputs.has-diff }}
  head-artifact-url:
    description: 'URL of the uploaded head PDF artifact. Empty when `upload-artifacts` is `false`.'
    value: ${{ steps.upload-head-pdfs.outputs.artifact-url }}
  diff-artifact-url:
    description: 'URL of the uploaded diff PDF artifact. Empty when no diff artifact was uploaded.'
    value: ${{ steps.upload-diff-pdfs.outputs.artifact-url }}

runs:
  using: composite

  steps:
    - name: Check runner platform
      shell: bash
      run: |
        if [ "${RUNNER_OS}" != 'Linux' ]; then
          echo '::error title=Unsupported runner::This action currently supports Linux runners only.'
          exit 1
        fi

    - name: Validate inputs
      shell: bash
      env:
        SUBMODULES: ${{ inputs.submodules }}
        HEAD_REF: ${{ inputs.head-ref }}
        BASE_REF: ${{ inputs.base-ref }}
        HEAD_DIR: ${{ inputs.head-dir }}
        BASE_DIR: ${{ inputs.base-dir }}
      run: bash "${GITHUB_ACTION_PATH}/src/validate-inputs.sh"

    - name: Resolve comparison revisions
      id: resolve-revisions
      if: inputs.head-dir == ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GH_REPO: ${{ github.repository }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PUSH_BEFORE_SHA: ${{ github.event.before }}
        HEAD_REF_INPUT: ${{ inputs.head-ref }}
        BASE_REF_INPUT: ${{ inputs.base-ref }}
      run: bash "${GITHUB_ACTION_PATH}/src/resolve-refs.sh"

    - name: Determine display revisions
      id: display-revisions
      shell: bash
      env:
        HEAD_DIR: ${{ inputs.head-dir }}
        BASE_DIR: ${{ inputs.base-dir }}
        RESOLVED_HEAD_REF: ${{ steps.resolve-revisions.outputs.head-ref }}
        RESOLVED_BASE_REF: ${{ steps.resolve-revisions.outputs.base-ref }}
      run: bash "${GITHUB_ACTION_PATH}/src/determine-display-refs.sh"

    - name: Determine artifact names
      id: determine-artifact-names
      shell: bash
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_REF: ${{ steps.display-revisions.outputs.head-ref }}
      run: bash "${GITHUB_ACTION_PATH}/src/determine-artifact-names.sh"

    - name: Check out the head revision
      if: inputs.head-dir == ''
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: head-src
        ref: ${{ steps.resolve-revisions.outputs.head-ref }}
        submodules: ${{ inputs.submodules }}
        token: ${{ inputs.github-token }}
        fetch-depth: 1
        persist-credentials: false

    - name: Check out the base revision
      if: inputs.head-dir == ''
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: base-src
        ref: ${{ steps.resolve-revisions.outputs.base-ref }}
        submodules: ${{ inputs.submodules }}
        token: ${{ inputs.github-token }}
        fetch-depth: 1
        persist-credentials: false

    - name: Install Typst
      uses: typst-community/setup-typst@40d32bb6ccb235bd7f5164cb47cfd40a5ea3a314 # v5.2.0
      with:
        typst-version: ${{ inputs.typst-version }}

    - name: Install PDF diff tools
      shell: bash
      run: bash "${GITHUB_ACTION_PATH}/src/install-pdf-diff-tools.sh"

    - name: Build head PDFs
      shell: bash
      env:
        TARGET_FILES: ${{ inputs.target-files }}
        SOURCE_DIR: ${{ inputs.head-dir || 'head-src' }}
        OUTPUT_DIR: build/head
      run: bash "${GITHUB_ACTION_PATH}/src/build-pdfs.sh"

    - name: Build base PDFs
      shell: bash
      env:
        TARGET_FILES: ${{ inputs.target-files }}
        SOURCE_DIR: ${{ inputs.base-dir || 'base-src' }}
        OUTPUT_DIR: build/base
      run: bash "${GITHUB_ACTION_PATH}/src/build-pdfs.sh"

    - name: Generate PDF diff
      id: generate-diff
      shell: bash
      env:
        TARGET_FILES: ${{ inputs.target-files }}
        BASE_DIR: build/base
        HEAD_DIR: build/head
        DIFF_DIR: build/diff
        META_DIR: build/meta
      run: bash "${GITHUB_ACTION_PATH}/src/generate-diff.sh"

    - name: Upload head PDFs artifact
      id: upload-head-pdfs
      if: inputs.upload-artifacts == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ steps.determine-artifact-names.outputs.head-artifact-name }}
        path: 'build/head/**/*.pdf'
        if-no-files-found: error

    - name: Upload diff PDFs artifact
      id: upload-diff-pdfs
      if: >-
        inputs.upload-artifacts == 'true'
        && steps.generate-diff.outputs.has-diff == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ steps.determine-artifact-names.outputs.diff-artifact-name }}
        path: 'build/diff/**/*.pdf'
        if-no-files-found: error

    - name: Build pull request comment body
      if: inputs.post-comment == 'true'
      shell: bash
      env:
        SUPPLIED_HEAD_DIR: ${{ inputs.head-dir }}
        HEAD_REF: ${{ steps.display-revisions.outputs.head-ref }}
        BASE_REF: ${{ steps.display-revisions.outputs.base-ref }}
        RESULT_TSV: ${{ steps.generate-diff.outputs.result-tsv }}
        HEAD_ARTIFACT_URL: ${{ steps.upload-head-pdfs.outputs.artifact-url }}
        DIFF_ARTIFACT_URL: ${{ steps.upload-diff-pdfs.outputs.artifact-url }}
      run: bash "${GITHUB_ACTION_PATH}/src/build-comment.sh"

    - name: Post pull request comment
      if: inputs.post-comment == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GH_REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        COMMENT_MODE: ${{ inputs.comment-mode }}
        FAIL_ON_COMMENT_ERROR: ${{ inputs.fail-on-comment-error }}
        COMMENT_FILE: build/meta/pr-comment.md
      run: bash "${GITHUB_ACTION_PATH}/src/post-comment.sh"
