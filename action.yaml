name: 'Typst PDF Diff Action'
description: 'Generate PDF diffs for Typst documents'
author: 'conjikidow'

inputs:
  target-files:
    description: 'Space-separated Typst entrypoint files to compile.'
    required: true
  typst-version:
    description: 'Version of Typst to use.'
    required: false
    default: 'latest'
  github-token:
    description: >-
      Token used to authenticate with GitHub. Needs `contents: read` for the
      checkout and `pull-requests: write` for the comment.
    required: false
    default: ${{ github.token }}
  submodules:
    description: 'Submodule mode passed to `actions/checkout`: `false`, `true`, or `recursive`.'
    required: false
    default: 'false'
  head-ref:
    description: 'Head revision to compare. Defaults to the pull request head SHA or `github.sha`.'
    required: false
    default: ''
  base-ref:
    description: 'Base revision to compare. Defaults to the merge-base of the pull request or `github.event.before`.'
    required: false
    default: ''
  head-dir:
    description: 'Existing working tree to build the head revision from. Requires `base-dir`.'
    required: false
    default: ''
  base-dir:
    description: 'Existing working tree to build the base revision from. Requires `head-dir`.'
    required: false
    default: ''
  post-comment:
    description: 'Whether to update a pull request comment with the diff results.'
    required: false
    default: 'true'
  comment-mode:
    description: 'Comment update mode: `replace` or `append`.'
    required: false
    default: 'replace'
  fail-on-comment-error:
    description: 'Whether to fail the action when the comment update fails.'
    required: false
    default: 'false'
  upload-artifacts:
    description: 'Whether to upload the head and diff PDFs as workflow artifacts.'
    required: false
    default: 'true'

outputs:
  has-diff:
    description: '`true` when at least one target file produces a diff PDF.'
    value: ${{ steps.generate-diff.outputs.has_diff }}
  head-artifact-url:
    description: 'URL of the uploaded head PDF artifact. Empty when `upload-artifacts` is `false`.'
    value: ${{ steps.upload-head-pdfs.outputs.artifact-url }}
  diff-artifact-url:
    description: 'URL of the uploaded diff PDF artifact. Empty when no diff artifact was uploaded.'
    value: ${{ steps.upload-diff-pdfs.outputs.artifact-url }}

runs:
  using: 'composite'
  steps:
    - name: Check runner platform
      shell: bash
      run: |
        if [ "${RUNNER_OS}" != 'Linux' ]; then
          echo '::error title=Unsupported runner::' \
            'This action currently supports Linux runners only.'
          exit 1
        fi

    - name: Validate inputs
      shell: bash
      env:
        SUBMODULES: ${{ inputs.submodules }}
        HEAD_REF: ${{ inputs.head-ref }}
        BASE_REF: ${{ inputs.base-ref }}
        HEAD_DIR: ${{ inputs.head-dir }}
        BASE_DIR: ${{ inputs.base-dir }}
      run: bash "${{ github.action_path }}/src/validate-inputs.sh"

    - name: Resolve comparison revisions
      id: resolve-refs
      if: ${{ inputs.head-dir == '' }}
      shell: bash
      env:
        INPUT_HEAD_REF: ${{ inputs.head-ref }}
        INPUT_BASE_REF: ${{ inputs.base-ref }}
        GH_TOKEN: ${{ inputs.github-token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        GITHUB_SHA: ${{ github.sha }}
        GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: bash "${{ github.action_path }}/src/resolve-refs.sh"

    - name: Determine display revisions
      id: display-refs
      shell: bash
      env:
        RESOLVED_HEAD_REF: ${{ steps.resolve-refs.outputs.head_ref }}
        RESOLVED_BASE_REF: ${{ steps.resolve-refs.outputs.base_ref }}
        HEAD_DIR: ${{ inputs.head-dir }}
        BASE_DIR: ${{ inputs.base-dir }}
      run: bash "${{ github.action_path }}/src/determine-display-refs.sh"

    - name: Determine artifact names
      id: determine-artifact-names
      shell: bash
      env:
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_REF: ${{ steps.display-refs.outputs.head_ref }}
      run: bash "${{ github.action_path }}/src/determine-artifact-names.sh"

    - name: Checkout the head revision
      if: ${{ inputs.head-dir == '' }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: head-src
        ref: ${{ steps.resolve-refs.outputs.head_ref }}
        submodules: ${{ inputs.submodules }}
        token: ${{ inputs.github-token }}
        fetch-depth: 1
        persist-credentials: false

    - name: Checkout the base revision
      if: ${{ inputs.head-dir == '' }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: base-src
        ref: ${{ steps.resolve-refs.outputs.base_ref }}
        submodules: ${{ inputs.submodules }}
        token: ${{ inputs.github-token }}
        fetch-depth: 1
        persist-credentials: false

    - name: Install Typst
      uses: typst-community/setup-typst@40d32bb6ccb235bd7f5164cb47cfd40a5ea3a314 # v5.2.0
      with:
        typst-version: ${{ inputs.typst-version }}

    - name: Install PDF diff tools
      shell: bash
      run: bash "${{ github.action_path }}/src/install-pdf-diff-tools.sh"

    - name: Build head PDFs
      shell: bash
      env:
        TARGET_FILES: ${{ inputs.target-files }}
        SOURCE_DIR: ${{ inputs.head-dir || 'head-src' }}
        OUTPUT_DIR: build/head
      run: bash "${{ github.action_path }}/src/build-pdfs.sh"

    - name: Build base PDFs
      shell: bash
      env:
        TARGET_FILES: ${{ inputs.target-files }}
        SOURCE_DIR: ${{ inputs.base-dir || 'base-src' }}
        OUTPUT_DIR: build/base
      run: bash "${{ github.action_path }}/src/build-pdfs.sh"

    - name: Generate PDF diff
      id: generate-diff
      shell: bash
      env:
        TARGET_FILES: ${{ inputs.target-files }}
        BASE_DIR: build/base
        HEAD_DIR: build/head
        DIFF_DIR: build/diff
        META_DIR: build/meta
      run: bash "${{ github.action_path }}/src/generate-diff.sh"

    - name: Upload head PDFs artifact
      id: upload-head-pdfs
      if: ${{ inputs.upload-artifacts == 'true' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ steps.determine-artifact-names.outputs.head_artifact_name }}
        path: build/head/**/*.pdf
        if-no-files-found: error

    - name: Upload diff PDFs artifact
      id: upload-diff-pdfs
      if: ${{ inputs.upload-artifacts == 'true' && steps.generate-diff.outputs.has_diff == 'true' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ steps.determine-artifact-names.outputs.diff_artifact_name }}
        path: build/diff/**/*.pdf
        if-no-files-found: error

    - name: Build PR comment body
      if: ${{ inputs.post-comment == 'true' }}
      shell: bash
      env:
        RESULT_TSV: ${{ steps.generate-diff.outputs.result_tsv }}
        HAS_DIFF: ${{ steps.generate-diff.outputs.has_diff }}
        HEAD_REF: ${{ steps.display-refs.outputs.head_ref }}
        BASE_REF: ${{ steps.display-refs.outputs.base_ref }}
        SUPPLIED_HEAD_DIR: ${{ inputs.head-dir }}
        HEAD_ARTIFACT_URL: ${{ steps.upload-head-pdfs.outputs.artifact-url }}
        DIFF_ARTIFACT_URL: ${{ steps.upload-diff-pdfs.outputs.artifact-url }}
      run: bash "${{ github.action_path }}/src/build-comment.sh"

    - name: Update PR comment
      if: ${{ inputs.post-comment == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        COMMENT_MODE: ${{ inputs.comment-mode }}
        FAIL_ON_COMMENT_ERROR: ${{ inputs.fail-on-comment-error }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        COMMENT_FILE: build/meta/pr-comment.md
      run: bash "${{ github.action_path }}/src/post-comment.sh"

branding:
  icon: 'file-text'
  color: 'green'
